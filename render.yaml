services:
  - type: web
    name: hotel-murder-online
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER_ORDER
        value: groq,gemini
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_MODEL_PRIMARY
        value: gemini-3.1-flash-lite
      - key: GEMINI_MODEL_FAST
        value: gemini-3.1-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
